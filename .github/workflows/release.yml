name: Release

# 仅在推送形如 v0.1.0 的 tag 时触发，普通分支推送不触发
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  CARGO_TERM_COLOR: always

jobs:
  # ──────────────────────────────────────────────
  # macOS（Intel x86_64 + Apple Silicon aarch64）
  # ──────────────────────────────────────────────
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest      # Apple Silicon aarch64（原生编译）
            arch: aarch64
            target: aarch64-apple-darwin
            ort_suffix: arm64
          - runner: macos-15-intel    # Intel x86_64（原生编译）
            arch: x86_64
            target: x86_64-apple-darwin
            ort_suffix: x86_64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: macos-${{ matrix.target }}

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked

      - name: Download ORT 1.23.2 for packaging
        run: |
          set -e
          ORT_VERSION="1.23.2"
          curl -fsSL \
            "https://github.com/microsoft/onnxruntime/releases/download/v${ORT_VERSION}/onnxruntime-osx-${{ matrix.ort_suffix }}-${ORT_VERSION}.tgz" \
            | tar xz -C "$RUNNER_TEMP"
          echo "ORT_DYLIB_PATH=$RUNNER_TEMP/onnxruntime-osx-${{ matrix.ort_suffix }}-${ORT_VERSION}/lib/libonnxruntime.${ORT_VERSION}.dylib" >> "$GITHUB_ENV"

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Import signing certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # 创建临时 keychain，避免污染系统 keychain
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          KEYCHAIN_PATH="$RUNNER_TEMP/signing.keychain-db"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # 导入证书
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | xargs)
          security set-key-partition-list \
            -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          rm "$RUNNER_TEMP/cert.p12"

          # 读取实际证书身份名，供后续步骤使用
          SIGNING_IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN_PATH" \
            | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "Found identity: $SIGNING_IDENTITY"
          echo "SIGNING_IDENTITY=$SIGNING_IDENTITY" >> "$GITHUB_ENV"

      - name: Create .app bundle
        run: |
          set -e
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          CARGO_BUNDLE_SKIP_BUILD=1 cargo bundle -p shanji-app -f osx --release -t ${{ matrix.target }}
          APP_BUNDLE="target/${{ matrix.target }}/release/bundle/osx/闪记.app"

          # cargo-bundle 负责标准 bundle 结构和图标，这里只补 release 版本号
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString ${VERSION}" "${APP_BUNDLE}/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${VERSION}" "${APP_BUNDLE}/Contents/Info.plist"

          # 复制 ONNX Runtime 动态库（load-dynamic 运行时加载）
          mkdir -p "${APP_BUNDLE}/Contents/Frameworks"
          ORT_FILENAME=$(basename "$ORT_DYLIB_PATH")
          cp "$ORT_DYLIB_PATH" "${APP_BUNDLE}/Contents/Frameworks/${ORT_FILENAME}"

      - name: Sign .app bundle
        run: |
          # 写入 entitlements 文件
          ENTITLEMENTS="$RUNNER_TEMP/entitlements.plist"
          cat > "$ENTITLEMENTS" << 'ENTEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>com.apple.security.cs.allow-jit</key><false/>
            <key>com.apple.security.cs.allow-unsigned-executable-memory</key><false/>
            <key>com.apple.security.cs.disable-library-validation</key><true/>
            <key>com.apple.security.device.audio-input</key><true/>
            <key>com.apple.security.automation.apple-events</key><true/>
          </dict></plist>
          ENTEOF

          # 先签 Frameworks 内的动态库，再签整个 .app
          find "target/${{ matrix.target }}/release/bundle/osx/闪记.app/Contents/Frameworks" -name "*.dylib" | while read lib; do
            codesign --force --options runtime \
              --sign "$SIGNING_IDENTITY" \
              "$lib"
          done

          codesign --force --deep --options runtime \
            --entitlements "$ENTITLEMENTS" \
            --sign "$SIGNING_IDENTITY" \
            "target/${{ matrix.target }}/release/bundle/osx/闪记.app"

          codesign --verify --deep --strict "target/${{ matrix.target }}/release/bundle/osx/闪记.app"
          echo "✓ Code signing OK"

      - name: Create DMG and sign it
        run: |
          set -e
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          DMG_NAME="shanji-app-${VERSION}-macos-${{ matrix.arch }}.dmg"
          DMG_ROOT="$RUNNER_TEMP/dmg-root"
          APP_BUNDLE="target/${{ matrix.target }}/release/bundle/osx/闪记.app"

          rm -rf "$DMG_ROOT"
          mkdir -p "$DMG_ROOT"
          mkdir -p dist
          ditto "$APP_BUNDLE" "$DMG_ROOT/闪记.app"
          ln -s /Applications "$DMG_ROOT/Applications"

          hdiutil create \
            -volname "闪记 ${VERSION}" \
            -srcfolder "$DMG_ROOT" \
            -ov -format UDZO \
            "dist/${DMG_NAME}"

          codesign --force \
            --sign "$SIGNING_IDENTITY" \
            "dist/${DMG_NAME}"
          echo "✓ Created and signed dist/${DMG_NAME}"

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          DMG_NAME="shanji-app-${VERSION}-macos-${{ matrix.arch }}.dmg"

          # 提交公证，等待结果（最长 10 分钟）
          xcrun notarytool submit "dist/${DMG_NAME}" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait \
            --timeout 1800

          # 将公证票据 staple 到 DMG，让离线环境也能验证
          xcrun stapler staple "dist/${DMG_NAME}"
          echo "✓ Notarization and stapling OK"

      - uses: actions/upload-artifact@v4
        with:
          name: shanji-macos-${{ matrix.arch }}
          path: dist/*.dmg

  # ──────────────────────────────────────────────
  # Windows x64
  # ──────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: windows-x64

      - name: Build
        run: cargo build --release

      - name: Package
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          $dirName = "shanji-app-${version}-windows-x64"
          $outDir  = "dist\$dirName"
          New-Item -ItemType Directory -Force $outDir | Out-Null

          # 复制可执行文件
          Copy-Item "target\release\shanji.exe" $outDir

          # 复制 ONNX Runtime DLL
          $ortDll = Get-ChildItem -Recurse "target\release\build" `
            -Filter "onnxruntime*.dll" -ErrorAction SilentlyContinue `
            | Select-Object -First 1
          if ($ortDll) {
            Copy-Item $ortDll.FullName $outDir
            Write-Host "Bundled ORT: $($ortDll.Name)"
          }

          # 打包成 ZIP
          Compress-Archive -Path $outDir `
            -DestinationPath "dist\shanji-app-${version}-windows-x64.zip"
          Write-Host "Created: dist\shanji-app-${version}-windows-x64.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: shanji-windows-x64
          path: dist/*.zip

  # ──────────────────────────────────────────────────────────────────
  # Linux x64：.tar.gz（通用）+ .deb（Debian/Ubuntu）+ .rpm（RHEL系）
  # ──────────────────────────────────────────────────────────────────
  build-linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          key: linux-x64

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libasound2-dev \
            libssl-dev \
            libgtk-3-dev \
            libxdo-dev \
            libdbus-1-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcb-render0-dev \
            libxcb-render-util0-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libudev-dev \
            libinput-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libgles2-mesa-dev \
            libwayland-dev \
            libxrandr-dev \
            libxi-dev \
            ruby ruby-dev rubygems build-essential \
            rpm                                        # rpm 工具链（供 fpm 生成 .rpm）

      - name: Install fpm
        run: sudo gem install --no-document fpm

      - name: Build
        run: cargo build --release

      - name: Package
        run: |
          set -e
          VERSION="${{ github.ref_name }}"
          VERSION="${VERSION#v}"
          STAGING="dist/staging"
          mkdir -p "$STAGING/usr/bin" "$STAGING/usr/lib" dist

          # 复制可执行文件
          cp "target/release/shanji" "$STAGING/usr/bin/shanji"
          chmod 755 "$STAGING/usr/bin/shanji"

          # 复制 ONNX Runtime .so（如存在）
          ORT_LIB=$(find "target/release/build" \
            -name "libonnxruntime*.so*" 2>/dev/null | head -1)
          ORT_FPM_ARG=()
          if [ -n "$ORT_LIB" ]; then
            ORT_LIB_NAME=$(basename "$ORT_LIB")
            cp "$ORT_LIB" "$STAGING/usr/lib/$ORT_LIB_NAME"
            ORT_FPM_ARG=("$STAGING/usr/lib/$ORT_LIB_NAME=/usr/lib/$ORT_LIB_NAME")
            echo "Bundled ORT: $ORT_LIB_NAME"
          fi

          # 所有 flag 必须在文件映射参数之前
          FPM_FLAGS=(
            -s dir
            -n shanji
            -v "$VERSION"
            --description "AI 语音输入工具 / AI voice input"
            --url "https://github.com/${{ github.repository }}"
            --license "MIT"
            --maintainer "YuHuo"
          )
          FPM_FILES=(
            "$STAGING/usr/bin/shanji=/usr/bin/shanji"
          )
          if [ -n "$ORT_LIB" ]; then
            FPM_FILES+=("$STAGING/usr/lib/$ORT_LIB_NAME=/usr/lib/$ORT_LIB_NAME")
          fi

          # ── tar.gz（通用，解压即用）──────────────────────────────
          DIR_NAME="shanji-app-${VERSION}-linux-x64"
          TAR_DIR="dist/${DIR_NAME}"
          mkdir -p "$TAR_DIR"
          cp "$STAGING/usr/bin/shanji" "$TAR_DIR/"
          [ -n "$ORT_LIB" ] && cp "$ORT_LIB" "$TAR_DIR/"
          tar -czf "dist/shanji-app-${VERSION}-linux-x64.tar.gz" -C dist "$DIR_NAME"
          echo "Created: shanji-app-${VERSION}-linux-x64.tar.gz"

          # ── .deb（Debian 12 / Ubuntu 20.04+）────────────────────
          fpm "${FPM_FLAGS[@]}" \
            -t deb \
            --architecture amd64 \
            --deb-no-default-config-files \
            -p "dist/shanji-app-${VERSION}-linux-x64.deb" \
            "${FPM_FILES[@]}"
          echo "Created: shanji-app-${VERSION}-linux-x64.deb"

          # ── .rpm（RHEL 8/9 / Fedora / CentOS Stream / openSUSE）─
          fpm "${FPM_FLAGS[@]}" \
            -t rpm \
            --architecture x86_64 \
            --rpm-os linux \
            -p "dist/shanji-app-${VERSION}-linux-x64.rpm" \
            "${FPM_FILES[@]}"
          echo "Created: shanji-app-${VERSION}-linux-x64.rpm"

      - uses: actions/upload-artifact@v4
        with:
          name: shanji-linux-x64
          path: |
            dist/*.tar.gz
            dist/*.deb
            dist/*.rpm

  # ──────────────────────────────────────────────
  # 汇总：创建 GitHub Release 并上传所有产物
  # ──────────────────────────────────────────────
  release:
    needs: [build-macos, build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          # 含 "-" 的 tag（如 v0.1.0-beta）自动标记为预发布
          prerelease: ${{ contains(github.ref_name, '-') }}
          files: |
            artifacts/**/*.dmg
            artifacts/**/*.zip
            artifacts/**/*.tar.gz
            artifacts/**/*.deb
            artifacts/**/*.rpm
