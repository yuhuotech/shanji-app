name: Update Website Assets on Release

on:
  release:
    types: [published, edited]
  workflow_dispatch: # 允许手动触发

jobs:
  update-assets:
    runs-on: ubuntu-latest
    permissions:
      contents: write # 必须有写入权限才能提交代码
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/checkout@v4
        # 虽然上面写了 setup python，但实际上直接用系统 python 即可，为了稳健还是写一下
      
      - name: Run Update Script
        run: python3 scripts/refresh_web_assets.py

      - name: Commit and Push Changes
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add web/*.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "chore: auto-update website assets for latest release"
            git push
          fi
