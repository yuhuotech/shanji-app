[package]
name = "shanji-core"
version = "0.1.0"
edition = "2021"

[target.'cfg(target_os = "macos")'.dependencies]
objc = "0.2"

[dependencies]
anyhow = "1"
arboard = "3"
cpal = "0.15"
csv = "1.4"
dirs = "5"
enigo = "0.2.1"
keyring = { version = "2", features = ["linux-no-secret-service"] }
log = "0.4"
ndarray = "0.15"
once_cell = "1"
ort = "2.0.0-rc.5"
parking_lot = "0.12"
reqwest = { version = "0.12", features = ["blocking", "json", "stream"] }
flate2 = "1"
tar = "0.4"
rubato = "0.14"
chrono = { version = "0.4", features = ["clock"] }
rusqlite = { version = "0.31", features = ["bundled-full", "chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["rt", "sync"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2"
nnnoiseless = "0.4"

[dev-dependencies]
tempfile = "3"
