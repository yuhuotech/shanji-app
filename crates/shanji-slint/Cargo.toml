[package]
name = "shanji-app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "shanji"
path = "src/main.rs"

[dependencies]
shanji-core = { path = "../shanji-core" }
shanji-platform = { path = "../shanji-platform" }
slint = "1"
log = "0.4"
env_logger = "0.11"
hound = "3"
global-hotkey = "0.6"
tray-icon = "0.21"
rodio = "0.20"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSScreen"] }

[build-dependencies]
slint-build = "1"
