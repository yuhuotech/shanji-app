[package]
name = "shanji-app"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "AI 语音输入工具"

[[bin]]
name = "shanji"
path = "src/main.rs"

[dependencies]
shanji-core = { path = "../shanji-core" }
shanji-platform = { path = "../shanji-platform" }
slint = "1"
log = "0.4"
env_logger = "0.11"
hound = "3"
global-hotkey = "0.6"
tray-icon = "0.21"
rodio = "0.20"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3.2", features = ["NSScreen", "NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[build-dependencies]
slint-build = "1"

[package.metadata.bundle]
identifier = "com.yuhuo.shanjiapp"
name = "闪记"
icon = ["crates/shanji-slint/assets/shanji_logo.png"]
category = "public.app-category.utilities"
short_description = "AI 语音输入工具"
osx_minimum_system_version = "11.0"
osx_info_plist_exts = ["crates/shanji-slint/macos/Info.plist.ext"]
